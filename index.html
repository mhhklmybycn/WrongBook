<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="错题本 —— 拍照导入、AI 识图整理、生成解析的本地化错题管理工具">
<title>错题本 · 智能错题库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c0392b'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23fbf6ec' font-family='serif' font-weight='700'%3E%E9%94%99%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体非阻塞加载：网络受限时立即回退到系统宋体/黑体，不影响应用启动 -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============ 侧边导航 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-seal" aria-hidden="true">错</div>
      <div class="brand-text">
        <strong>错题本</strong>
        <span>温故而知新</span>
      </div>
    </div>

    <nav class="nav" aria-label="主导航">
      <a class="nav-item" data-route="library" href="#/library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>错题文库</span>
      </a>
      <a class="nav-item" data-route="import" href="#/import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>导入错题</span>
      </a>
      <a class="nav-item" data-route="settings" href="#/settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>API 设置</span>
      </a>
      <a class="nav-item" data-route="help" href="#/help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>帮助中心</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <button class="ghost-btn" id="themeToggle" title="切换深浅色">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <p class="sidebar-note">错题存于本机；识别时图片会发送给你配置的 AI</p>
    </div>
  </aside>

  <!-- ============ 主区域 ============ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="viewTitle">错题文库</h1>
        <p id="viewSubtitle" class="topbar-sub"></p>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <main class="content" id="content"><!-- 视图渲染处 --></main>

    <!-- 遮罩（移动端导航抽屉），置于 .app 内部以便与侧边栏按 40/50 正确分层 -->
    <div class="scrim" id="scrim" hidden></div>
  </div>
</div>

<!-- ============ 全局浮层：Toast / 确认框 / 模态 / 图片灯箱 ============ -->
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<div class="modal-root" id="modalRoot" hidden></div>
<div class="lightbox" id="lightbox" hidden><img alt="错题图片放大预览"></div>

<!-- 第三方库（Tesseract / SheetJS）在首次使用相关功能时按需动态加载，离线时优雅降级 -->

<!-- ============ 应用脚本（经典脚本，file:// 也可直接运行） ============ -->
<script src="js/db.js"></script>
<script src="js/api.js"></script>
<script src="js/editor.js"></script>
<script src="js/exporter.js"></script>
<script src="js/app.js"></script>
</body>
</html>
